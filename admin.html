<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ASAR SPORT - LUXURY АДМИН ПАНЕЛЬ</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-main: #070b19;
            --card-bg: rgba(19, 30, 58, 0.75);
            --card-border: rgba(212, 175, 55, 0.25);
            --card-border-hover: rgba(212, 175, 55, 0.6);
            --gold-accent: #d4af37;
            --gold-gradient: linear-gradient(135deg, #f39c12, #d4af37);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #0b1329;
            --input-border: #1e2d54;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--bg-main) !important; 
            color: var(--text-main); 
            padding: 24px 4% 60px 4%; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            -webkit-tap-highlight-color: transparent;
        }

        /* Luxury Glassmorphism Container Base */
        .glass-box {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        /* Login Overlay */
        .login-overlay { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background-color: var(--bg-main); 
            display: flex; justify-content: center; align-items: center; 
            z-index: 9999; 
        }
        .login-box { 
            width: 90%; max-width: 380px; 
            padding: 35px 28px; 
            text-align: center; 
        }
        .login-box h3 { 
            margin-bottom: 20px; font-weight: 800; font-size: 20px; 
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .login-box input { 
            width: 100%; padding: 14px; 
            border: 1px solid var(--input-border); border-radius: 12px; 
            margin-bottom: 18px; outline: none; font-size: 16px; 
            text-align: center; background: var(--input-bg); color: #ffffff; 
        }
        .login-box input:focus { border-color: var(--gold-accent); }
        .btn-login { 
            background: var(--gold-gradient); color: #000; border: none; 
            padding: 14px; width: 100%; border-radius: 12px; 
            font-size: 15px; font-weight: 800; cursor: pointer; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .btn-login:hover { transform: translateY(-2px); opacity: 0.95; }

        /* Main Admin Layout */
        .admin-main-content { display: none; width: 100%; max-width: 680px; }
        .header-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .btn-back { 
            background: var(--card-bg); border: 1px solid var(--card-border); 
            width: 42px; height: 42px; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; 
            color: var(--gold-accent); text-decoration: none; font-size: 16px; 
        }
        .btn-back:hover { border-color: var(--gold-accent); background: #131e3a; }
        .btn-logout {
            background: rgba(239, 68, 68, 0.1); color: #f87171; 
            border: 1px solid rgba(239, 68, 68, 0.3); 
            padding: 10px 16px; border-radius: 12px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-logout:hover { background: #ef4444; color: white; }
        h2 { 
            font-size: 19px; font-weight: 800; 
            background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 24px;
        }
        .site-visit-card {
            padding: 20px; text-align: center;
        }
        .site-visit-title { font-size: 11px; color: var(--text-muted); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
        .site-visit-count { font-size: 26px; font-weight: 800; color: var(--gold-accent); margin-top: 6px; }

        .admin-box { 
            padding: 24px; width: 100%; margin-bottom: 28px;
        }

        .form-group { margin-bottom: 20px; }
        .form-group label { 
            display: block; font-size: 12px; font-weight: 700; color: var(--gold-accent); 
            margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.8px; 
        }
        .form-group input, .form-group select, .form-group textarea { 
            width: 100%; padding: 12px 14px; border: 1px solid var(--input-border); 
            border-radius: 10px; font-size: 14px; background-color: var(--input-bg); color: #ffffff; outline: none; font-family: inherit;
            transition: 0.2s;
        }
        .form-group textarea { resize: vertical; min-height: 85px; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--gold-accent); }

        /* Color Checkboxes List */
        .color-checkbox-group {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }
        .color-check-item {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            padding: 8px 14px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            font-size: 13px;
            transition: 0.2s;
        }
        .color-check-item:hover { border-color: var(--gold-accent); }
        .color-check-item input[type="checkbox"] {
            width: auto; cursor: pointer;
        }

        /* Color & Size Variant Section */
        .color-variant-block {
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
        }
        .color-variant-header {
            font-size: 13px;
            font-weight: bold;
            color: var(--gold-accent);
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .size-stock-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(75px, 1fr));
            gap: 8px;
        }
        .size-stock-card {
            background: #131e3a;
            border: 1px solid var(--input-border);
            padding: 8px;
            border-radius: 8px;
            text-align: center;
        }
        .size-stock-card span {
            font-size: 11px;
            font-weight: bold;
            color: var(--text-muted);
            display: block;
            margin-bottom: 4px;
        }
        .size-stock-card input {
            width: 100%;
            padding: 4px;
            text-align: center;
            font-size: 12px;
            border-radius: 6px;
            border: 1px solid var(--input-border);
            background: var(--input-bg);
            color: #fff;
        }

        .file-input-wrapper { 
            background-color: var(--input-bg); border: 2px dashed var(--input-border); 
            padding: 24px; border-radius: 12px; text-align: center; cursor: pointer; position: relative; color: var(--text-muted); font-size: 13px; font-weight: 600;
            transition: 0.2s;
        }
        .file-input-wrapper:hover { border-color: var(--gold-accent); }
        .file-input-wrapper input[type="file"] { position: absolute; left: 0; top: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer; }

        .preview-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 15px; }
        .preview-item { position: relative; width: 75px; height: 75px; }
        .preview-thumbnail { width: 100%; height: 100%; border-radius: 10px; object-fit: cover; border: 1px solid var(--input-border); }
        .remove-img-btn { 
            position: absolute; top: -6px; right: -6px; 
            background: #ef4444; color: white; border: none; border-radius: 50%; 
            width: 22px; height: 22px; font-size: 11px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; 
        }

        .btn-add { 
            background: var(--gold-gradient); color: #000; border: none; padding: 15px; 
            width: 100%; border-radius: 12px; font-size: 15px; font-weight: 800; cursor: pointer; margin-top: 10px; transition: 0.2s;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }
        .btn-add:hover { opacity: 0.95; transform: translateY(-1px); }

        .section-title { font-size: 16px; font-weight: 800; color: #ffffff; margin: 30px 0 14px 0; width: 100%; text-align: left; display: flex; align-items: center; gap: 10px; }
        
        .product-list, .order-list { width: 100%; }

        .admin-prod-card, .order-card { 
            padding: 16px; margin-bottom: 14px; 
            display: flex; align-items: center; justify-content: space-between; gap: 14px;
        }

        .order-card { flex-direction: column; align-items: flex-start; }

        .admin-prod-card img { width: 70px; height: 70px; object-fit: cover; border-radius: 12px; border: 1px solid var(--input-border); }
        .prod-info, .order-info { flex-grow: 1; text-align: left; width: 100%; }
        .prod-name { font-size: 15px; font-weight: 700; color: #ffffff; }
        .prod-price { font-size: 15px; font-weight: 800; color: var(--gold-accent); margin-top: 2px; }
        .prod-desc { font-size: 12px; color: var(--text-muted); margin-top: 4px; line-height: 1.4; }

        .order-row { font-size: 13px; color: #cbd5e1; margin-bottom: 5px; }
        .order-row b { color: #ffffff; }
        .order-code-badge { background: var(--input-bg); border: 1px solid var(--input-border); padding: 3px 8px; border-radius: 6px; font-size: 11px; color: var(--gold-accent); font-weight: bold; }

        .stats-container { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; }
        .stat-badge { font-size: 11px; font-weight: 700; padding: 4px 10px; border-radius: 8px; }
        .stat-views { background-color: var(--input-bg); border: 1px solid var(--input-border); color: #38bdf8; }
        .stat-orders { background-color: var(--input-bg); border: 1px solid var(--input-border); color: #60a5fa; }
        .stat-sizes { background-color: var(--input-bg); border: 1px solid var(--input-border); color: #a855f7; }
        .stat-colors { background-color: var(--input-bg); border: 1px solid var(--input-border); color: #ec4899; }
        .stat-status-in { background-color: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
        .stat-status-out { background-color: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }
        .stat-stock { background-color: var(--input-bg); border: 1px solid var(--input-border); color: var(--gold-accent); }

        .prod-actions { display: flex; flex-direction: column; gap: 8px; }

        .btn-edit { 
            background-color: rgba(212, 175, 55, 0.15); color: var(--gold-accent); 
            border: 1px solid rgba(212, 175, 55, 0.3); padding: 8px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-edit:hover { background-color: var(--gold-accent); color: #000; }

        .btn-delete { 
            background-color: rgba(239, 68, 68, 0.15); color: #ef4444; 
            border: 1px solid rgba(239, 68, 68, 0.3); padding: 8px 12px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-delete:hover { background-color: #ef4444; color: white; }

        .btn-complete { 
            background: linear-gradient(135deg, #10b981, #059669); color: white; border: none; 
            padding: 12px 16px; border-radius: 10px; font-size: 12px; font-weight: 700; cursor: pointer; width: 100%; margin-top: 10px; transition: 0.2s;
        }
        .btn-complete:hover { opacity: 0.9; }

        .empty-text { 
            color: var(--text-muted); font-size: 14px; text-align: center; padding: 30px; 
            width: 100%;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(7, 11, 25, 0.85); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 10000; padding: 20px;
        }
        .modal-box {
            width: 100%; max-width: 520px; max-height: 90vh; overflow-y: auto; padding: 28px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; }
        .modal-header h3 { font-size: 18px; color: #ffffff; }
        .btn-close-modal { background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; }
        .btn-save-edit {
            background: var(--gold-gradient); color: #000; border: none; padding: 14px; width: 100%;
            border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 10px;
        }
        .btn-save-edit:hover { opacity: 0.95; }

        .dot-icon { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    </style>
</head>
<body>

    <div id="loginOverlay" class="login-overlay">
        <div class="login-box glass-box">
            <h3>🔒 ASAR SPORT АДМИН</h3>
            <input type="password" id="adminPasswordInput" placeholder="Нэвтрэх код оруулна уу...">
            <button class="btn-login" onclick="window.checkAdminPassword()">Нэвтрэх</button>
        </div>
    </div>

    <div id="adminMainContent" class="admin-main-content">
        <div class="header-bar">
            <div class="header-left">
                <a href="index.html" class="btn-back"><i class="fa-solid fa-chevron-left"></i></a>
                <h2>ASAR SPORT АДМИН ПАНЕЛЬ</h2>
            </div>
            <button class="btn-logout" onclick="window.adminLogout()"><i class="fa-solid fa-right-from-bracket"></i> Гарах</button>
        </div>

        <div class="stats-grid">
            <div class="site-visit-card glass-box">
                <div class="site-visit-title"><i class="fa-solid fa-eye"></i> Дэлгүүрт ирсэн</div>
                <div class="site-visit-count" id="siteTotalVisits">0</div>
            </div>
            <div class="site-visit-card glass-box">
                <div class="site-visit-title" style="color: #34d399;"><i class="fa-solid fa-wallet"></i> Нийт орлого</div>
                <div class="site-visit-count" id="siteTotalRevenue" style="color: #10b981;">0₮</div>
            </div>
        </div>

        <div class="admin-box glass-box">
            <div class="form-group">
                <label>Бүтээгдэхүүний зургууд оруулах</label>
                <div class="file-input-wrapper">
                    <span id="uploadStatusText">📁 Энд дарж зургуудаа нэмнэ үү</span>
                    <input type="file" id="prodImageFile" accept="image/*" multiple onchange="window.handleImageSelect(this)">
                    <div id="imagePreviewContainer" class="preview-container"></div>
                </div>
            </div>

            <div class="form-group">
                <label>Бүтээгдэхүүний нэр</label>
                <input type="text" id="prodName" placeholder="Жишээ: Nike Pro Спорт цамц">
            </div>

            <!-- Өнгө сонгох хэсэг -->
            <div class="form-group">
                <label>Байгаа өнгөнүүдийг сонгоно уу (Заавал биш)</label>
                <div class="color-checkbox-group" id="addColorCheckboxes">
                    <label class="color-check-item"><input type="checkbox" value="Хар" onchange="window.renderVariantInputs('add')"><span class="dot-icon" style="background:#000;"></span> Хар</label>
                    <label class="color-check-item"><input type="checkbox" value="Цагаан" onchange="window.renderVariantInputs('add')"><span class="dot-icon" style="background:#fff;"></span> Цагаан</label>
                    <label class="color-check-item"><input type="checkbox" value="Улаан" onchange="window.renderVariantInputs('add')"><span class="dot-icon" style="background:#ef4444;"></span> Улаан</label>
                    <label class="color-check-item"><input type="checkbox" value="Хөх" onchange="window.renderVariantInputs('add')"><span class="dot-icon" style="background:#3b82f6;"></span> Хөх</label>
                    <label class="color-check-item"><input type="checkbox" value="Ногоон" onchange="window.renderVariantInputs('add')"><span class="dot-icon" style="background:#22c55e;"></span> Ногоон</label>
                    <label class="color-check-item"><input type="checkbox" value="Шар" onchange="window.renderVariantInputs('add')"><span class="dot-icon" style="background:#eab308;"></span> Шар</label>
                    <label class="color-check-item"><input type="checkbox" value="Саарал" onchange="window.renderVariantInputs('add')"><span class="dot-icon" style="background:#6b7280;"></span> Саарал</label>
                    <label class="color-check-item"><input type="checkbox" value="Ягаан" onchange="window.renderVariantInputs('add')"><span class="dot-icon" style="background:#ec4899;"></span> Ягаан</label>
                </div>
            </div>

            <!-- Өнгө эсвэл Нийт тоо ширхэг харуулах контейнер -->
            <div class="form-group">
                <label id="addVariantsLabel">Нийт үлдэгдэл тоо ширхэг</label>
                <div id="addVariantsContainer">
                    <input type="number" id="addSimpleStock" placeholder="Үлдэгдэл тоог оруулна уу..." min="0" value="1">
                </div>
            </div>

            <div class="form-group">
                <label>Бүтээгдэхүүний үнэ (₮)</label>
                <input type="text" id="prodPrice" placeholder="Жишээ: 85,000">
            </div>

            <div class="form-group">
                <label>Бүтээгдэхүүний тайлбар</label>
                <textarea id="prodDesc" placeholder="Материал, хийц, онцлог шинжийг энд бичнэ үү..."></textarea>
            </div>

            <div class="form-group">
                <label>Барааны төлөв</label>
                <select id="prodStatus">
                    <option value="in_stock">✅ Бэлэн байгаа</option>
                    <option value="out_of_stock">❌ Дууссан (Out of Stock)</option>
                </select>
            </div>

            <button class="btn-add" id="btnAddProduct" onclick="window.addProduct()">＋ Шинэ бараа нэмэх</button>
        </div>

        <div class="section-title"><i class="fa-solid fa-receipt" style="color: var(--gold-accent);"></i> Ирсэн бодит захиалгууд</div>
        <div class="order-list" id="adminOrderList">
            <p class="empty-text glass-box">Шинэ захиалга байхгүй байна...</p>
        </div>

        <div class="section-title"><i class="fa-solid fa-chart-simple" style="color: var(--gold-accent);"></i> Барааны хандалт & Статистик</div>
        <div class="product-list" id="adminProductList">
            <p class="empty-text glass-box">Ачаалж байна...</p>
        </div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal-overlay">
        <div class="modal-box glass-box">
            <div class="modal-header">
                <h3>✏️ Бараа засах</h3>
                <button class="btn-close-modal" onclick="window.closeEditModal()">✕</button>
            </div>
            <input type="hidden" id="editProdId">
            
            <div class="form-group">
                <label>Барааны нэр</label>
                <input type="text" id="editProdName">
            </div>

            <div class="form-group">
                <label>Байгаа өнгөнүүдийг сонгоно уу</label>
                <div class="color-checkbox-group" id="editColorCheckboxes">
                    <label class="color-check-item"><input type="checkbox" value="Хар" onchange="window.renderVariantInputs('edit')"><span class="dot-icon" style="background:#000;"></span> Хар</label>
                    <label class="color-check-item"><input type="checkbox" value="Цагаан" onchange="window.renderVariantInputs('edit')"><span class="dot-icon" style="background:#fff;"></span> Цагаан</label>
                    <label class="color-check-item"><input type="checkbox" value="Улаан" onchange="window.renderVariantInputs('edit')"><span class="dot-icon" style="background:#ef4444;"></span> Улаан</label>
                    <label class="color-check-item"><input type="checkbox" value="Хөх" onchange="window.renderVariantInputs('edit')"><span class="dot-icon" style="background:#3b82f6;"></span> Хөх</label>
                    <label class="color-check-item"><input type="checkbox" value="Ногоон" onchange="window.renderVariantInputs('edit')"><span class="dot-icon" style="background:#22c55e;"></span> Ногоон</label>
                    <label class="color-check-item"><input type="checkbox" value="Шар" onchange="window.renderVariantInputs('edit')"><span class="dot-icon" style="background:#eab308;"></span> Шар</label>
                    <label class="color-check-item"><input type="checkbox" value="Саарал" onchange="window.renderVariantInputs('edit')"><span class="dot-icon" style="background:#6b7280;"></span> Саарал</label>
                    <label class="color-check-item"><input type="checkbox" value="Ягаан" onchange="window.renderVariantInputs('edit')"><span class="dot-icon" style="background:#ec4899;"></span> Ягаан</label>
                </div>
            </div>

            <div class="form-group">
                <label id="editVariantsLabel">Нийт үлдэгдэл тоо ширхэг</label>
                <div id="editVariantsContainer">
                    <input type="number" id="editSimpleStock" placeholder="Үлдэгдэл тоог оруулна уу..." min="0">
                </div>
            </div>

            <div class="form-group">
                <label>Үнэ (₮)</label>
                <input type="text" id="editProdPrice">
            </div>

            <div class="form-group">
                <label>Тайлбар</label>
                <textarea id="editProdDesc"></textarea>
            </div>
            <div class="form-group">
                <label>Төлөв</label>
                <select id="editProdStatus">
                    <option value="in_stock">✅ Бэлэн байгаа</option>
                    <option value="out_of_stock">❌ Дууссан</option>
                </select>
            </div>
            <button class="btn-save-edit" onclick="window.saveProductEdit()">💾 Хадгалах</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {

            authDomain: "temka-shop.firebaseapp.com",

        function loadSiteVisits() {

        // ШИНЭЧИЛСЭН: Нийт орлогыг автоматаар нэгтгэн унших функц
        function loadTotalRevenue() {
            database.ref('total_revenue').on('value', function(snapshot) {
                let revenueFromDB = parseInt(snapshot.val()) || 0;

                database.ref('orders').on('value', function(orderSnapshot) {
                    let activeOrdersTotal = 0;
                    if (orderSnapshot.exists()) {
                        orderSnapshot.forEach(function(child) {
                            let order = child.val();
                            let rawPrice = order.price || order.totalAmount || 0;
                            let price = parseInt(rawPrice.toString().replace(/[^0-9]/g, '')) || 0;
                            activeOrdersTotal += price;
                        });
                    }

                    let finalRevenue = revenueFromDB + activeOrdersTotal;
                    let revenueElem = document.getElementById('siteTotalRevenue');
                    if (revenueElem) {
                        revenueElem.innerText = finalRevenue.toLocaleString() + '₮';
                    }
                });
            });
        }

        window.handleImageSelect = function(input) {
            if (input.files && input.files.length > 0) {
                let currentFilesCount = input.files.length;
                let filesProcessed = 0;

                Array.from(input.files).forEach(file => {
                    var reader = new FileReader();
                    reader.onload = function(e) {
                        selectedBase64Images.push(e.target.result);
                        filesProcessed++;
                        if(filesProcessed === currentFilesCount) {
                            renderThumbnails();
                        }
                    };
                    reader.readAsDataURL(file);
                });
                input.value = ""; 
            }
        };

        function renderThumbnails() {
            var container = document.getElementById("imagePreviewContainer");
            container.innerHTML = "";
            selectedBase64Images.forEach((imgSrc, index) => {
                var itemDiv = document.createElement("div");
                itemDiv.className = "preview-item";
                itemDiv.innerHTML = `
                    <img src="${imgSrc}" class="preview-thumbnail">
                    <button type="button" class="remove-img-btn" onclick="window.removeSelectedImage(${index})">✕</button>
                `;
                container.appendChild(itemDiv);
            });

            if (selectedBase64Images.length > 0) {
                document.getElementById("uploadStatusText").innerText = "✅ Нийт " + selectedBase64Images.length + " зураг сонгогдсон байна";
            } else {
                document.getElementById("uploadStatusText").innerText = "📁 Энд дарж зургуудаа нэмнэ үү";
            }
        }

        window.removeSelectedImage = function(index) {
            selectedBase64Images.splice(index, 1);
            renderThumbnails();

        // Өнгө ба Size render хийх систем (Өнгөгүй үед Нийт үлдэгдлийг л оруулах боломжтой)
        window.renderVariantInputs = function(type, existingVariants = {}, existingStock = 0) {
            var checkboxGroupId = type === 'add' ? 'addColorCheckboxes' : 'editColorCheckboxes';
            var containerId = type === 'add' ? 'addVariantsContainer' : 'editVariantsContainer';
            var labelId = type === 'add' ? 'addVariantsLabel' : 'editVariantsLabel';
            
            var checkboxes = document.querySelectorAll('#' + checkboxGroupId + ' input[type="checkbox"]:checked');
            var container = document.getElementById(containerId);
            var label = document.getElementById(labelId);
            container.innerHTML = "";

            if (checkboxes.length === 0) {
                label.innerText = "Нийт үлдэгдэл тоо ширхэг";
                var inputId = type === 'add' ? 'addSimpleStock' : 'editSimpleStock';
                var val = existingStock || 1;
                container.innerHTML = `<input type="number" id="${inputId}" placeholder="Үлдэгдэл тоог оруулна уу..." min="0" value="${val}">`;
                return;
            }

            label.innerText = "Өнгө тус бүрийн хэмжээ ба үлдэгдэл тоо";

            checkboxes.forEach(function(cb) {
                var color = cb.value;
                var colorBlock = document.createElement("div");
                colorBlock.className = "color-variant-block";
                colorBlock.setAttribute("data-color-name", color);

                var sizesHTML = "";
                AVAILABLE_SIZES.forEach(function(sz) {
                    var val = (existingVariants[color] && existingVariants[color][sz] !== undefined) ? existingVariants[color][sz] : 0;
                    sizesHTML += `
                        <div class="size-stock-card">
                            <span>${sz}</span>
                            <input type="number" data-size-key="${sz}" min="0" value="${val}">
                        </div>
                    `;
                });

                colorBlock.innerHTML = `
                    <div class="color-variant-header">🎨 Өнгө: <b>${color}</b></div>
                    <div class="size-stock-grid">${sizesHTML}</div>
                `;
                container.appendChild(colorBlock);
            });
        };

        function getVariantsData(type) {
            var checkboxGroupId = type === 'add' ? 'addColorCheckboxes' : 'editColorCheckboxes';
            var containerId = type === 'add' ? 'addVariantsContainer' : 'editVariantsContainer';
            var simpleInputId = type === 'add' ? 'addSimpleStock' : 'editSimpleStock';

            var checkboxes = document.querySelectorAll('#' + checkboxGroupId + ' input[type="checkbox"]:checked');
            
            if (checkboxes.length === 0) {
                var simpleInput = document.getElementById(simpleInputId);
                var total = simpleInput ? (parseInt(simpleInput.value) || 0) : 0;
                return {
                    variants: null,
                    colors: [],
                    sizes: [],
                    colorStocks: {},
                    sizeStocks: {},
                    totalStock: total
                };
            }

            var container = document.getElementById(containerId);
            var blocks = container.querySelectorAll('.color-variant-block');
            
            var variants = {};
            var colorsSet = new Set();
            var sizesSet = new Set();
            var colorStocks = {};
            var sizeStocks = {};
            var totalStock = 0;

            blocks.forEach(function(block) {
                var color = block.getAttribute("data-color-name");
                variants[color] = {};
                var colorTotal = 0;

                var inputs = block.querySelectorAll('input[data-size-key]');
                inputs.forEach(function(input) {
                    var sz = input.getAttribute("data-size-key");
                    var qty = parseInt(input.value) || 0;
                    
                    if (qty > 0) {
                        variants[color][sz] = qty;
                        colorsSet.add(color);
                        sizesSet.add(sz);
                        
                        colorTotal += qty;
                        sizeStocks[sz] = (sizeStocks[sz] || 0) + qty;
                        totalStock += qty;
                    }
                });

                if (colorTotal > 0) {
                    colorStocks[color] = colorTotal;
                }
            });

            return {
                variants: variants,
                colors: Array.from(colorsSet),
                sizes: Array.from(sizesSet),
                colorStocks: colorStocks,
                sizeStocks: sizeStocks,
                totalStock: totalStock
            };
        }

        function loadProducts() {
            var listDiv = document.getElementById("adminProductList");
            database.ref('products').on('value', function(snapshot) {
                listDiv.innerHTML = "";
                allProductsCache = {};
                if (!snapshot.exists()) { 
                    listDiv.innerHTML = '<p class="empty-text glass-box">Бараа байхгүй байна...</p>';
                    return; 
                }
                snapshot.forEach(function(childSnapshot) {
                    var prodId = childSnapshot.key;
                    var prod = childSnapshot.val();
                    allProductsCache[prodId] = prod;

                    var mainImg = (prod.images && prod.images.length > 0) ? prod.images[0] : 'https://via.placeholder.com/65';
                    
                    var totalStock = 0;

                    if (prod.variants) {
                        Object.keys(prod.variants).forEach(c => {
                            Object.keys(prod.variants[c]).forEach(sz => {
                                var qty = prod.variants[c][sz];
                                if (qty > 0) totalStock += qty;
                            });
                        });
                    } else if (prod.stock !== undefined) {
                        totalStock = prod.stock;
                    }

                    var isOutOfStock = prod.status === 'out_of_stock' || totalStock <= 0;
                    var statusBadge = isOutOfStock 
                        ? '<span class="stat-badge stat-status-out">❌ Дууссан</span>' 
                        : '<span class="stat-badge stat-status-in">✅ Бэлэн</span>';

                    var colorsText = (prod.colors && prod.colors.length > 0) ? prod.colors.join(', ') : 'Сонгоогүй';
                    var sizesText = (prod.sizes && prod.sizes.length > 0) ? prod.sizes.join(', ') : 'Сонгоогүй';

                    var row = document.createElement("div");
                    row.className = "admin-prod-card glass-box";
                    row.innerHTML = 
                        '<img src="' + mainImg + '" alt="">' +
                        '<div class="prod-info">' +
                            '<div class="prod-name">' + prod.name + '</div>' +
                            '<div class="prod-price">' + parseInt(prod.price || 0).toLocaleString() + '₮</div>' +
                            (prod.description ? '<div class="prod-desc">' + prod.description + '</div>' : '') +
                            '<div class="stats-container">' +
                                statusBadge +
                                '<span class="stat-badge stat-colors">🎨 ' + colorsText + '</span>' +
                                '<span class="stat-badge stat-sizes">📏 ' + sizesText + '</span>' +
                                '<span class="stat-badge stat-stock">📦 Нийт үлдэгдэл: ' + totalStock + '</span>' +
                                '<span class="stat-badge stat-views"><i class="fa-regular fa-eye"></i> ' + (prod.views || 0) + '</span>' +
                                '<span class="stat-badge stat-orders"><i class="fa-solid fa-cart-shopping"></i> ' + (prod.orders || 0) + '</span>' +
                            '</div>' +
                        '</div>' +
                        '<div class="prod-actions">' +
                            '<button class="btn-edit" onclick="window.openEditModal(\'' + prodId + '\')"><i class="fa-solid fa-pen-to-square"></i> Засах</button>' +
                            '<button class="btn-delete" onclick="window.deleteProduct(\'' + prodId + '\')"><i class="fa-solid fa-trash-can"></i></button>' +
                        '</div>';
                    listDiv.appendChild(row);
                });
            });
        }

        function loadOrders() {
            var orderDiv = document.getElementById("adminOrderList");

                    orderDiv.innerHTML = '<p class="empty-text glass-box">Шинэ захиалга байхгүй байна...</p>';

                }

                    var color = order.selectedColor || order.color || '';
                    var price = order.price || order.totalAmount || 0;

                    var card = document.createElement("div");
                    card.className = "order-card glass-box";

                        '<div class="order-info">' +

                            '<div class="order-row"><b>📞 Утас:</b> ' + (order.phone || 'Байхгүй') + '</div>' +
                            '<div class="order-row"><b>📦 Бараа:</b> ' + (order.items || order.productName || 'Мэдээлэлгүй') + '</div>' +
                            '<div class="order-row"><b>💰 Үнэ:</b> ' + parseInt(price).toLocaleString() + '₮</div>' +
                            '<div class="order-row"><b>🎨 Сонгосон өнгө:</b> ' + (color || 'Сонгоогүй') + '</div>' +
                            '<div class="order-row"><b>📏 Сонгосон хэмжээ:</b> ' + (size || 'Сонгоогүй') + '</div>' +
                            '<div class="order-row"><b>📍 Хаяг:</b> ' + (order.address || 'Байхгүй') + '</div>' +
                            '<div class="order-row" style="margin-top:6px;"><b>Гүйлгээний утга:</b> <span class="order-code-badge">' + (order.orderCode || 'Байхгүй') + '</span></div>' +
                        '</div>' +
                        '<button class="btn-complete" onclick="window.completeOrder(\'' + orderId + '\', \'' + prodId + '\', \'' + size + '\', \'' + color + '\', ' + price + ')">✅ Хүргэгдсэн (Орлогод бүртгэх & Хаах)</button>';

        window.addProduct = function() {
            var name = document.getElementById("prodName").value.trim();
            var price = document.getElementById("prodPrice").value.trim();
            var description = document.getElementById("prodDesc").value.trim();
            var status = document.getElementById("prodStatus").value;
            var btn = document.getElementById("btnAddProduct");

            var variantData = getVariantsData('add');

            if (selectedBase64Images.length === 0) { alert("Барааны зургийг оруулна уу!"); return; }
            if (!name || !price) { alert("Нэр болон үнийг оруулна уу!"); return; }

            btn.innerText = "Уншиж байна..."; btn.disabled = true;
            var numericPrice = parseInt(price.replace(/[^0-9]/g, '')) || 0;

            database.ref('products').push({
                images: selectedBase64Images,
                name: name,
                variants: variantData.variants,
                colors: variantData.colors,
                colorStocks: variantData.colorStocks,
                sizes: variantData.sizes,
                sizeStocks: variantData.sizeStocks,
                price: numericPrice,
                stock: variantData.totalStock,
                description: description,
                status: variantData.totalStock === 0 ? 'out_of_stock' : status,
                views: 0,
                orders: 0
            }).then(function() {
                alert("Бараа амжилттай нэмэгдлээ!");
                document.getElementById("prodImageFile").value = "";
                document.getElementById("imagePreviewContainer").innerHTML = "";
                document.getElementById("uploadStatusText").innerText = "📁 Энд дарж зургуудаа нэмнэ үү";
                document.getElementById("prodName").value = "";
                document.getElementById("prodPrice").value = "";
                document.getElementById("prodDesc").value = "";
                document.getElementById("prodStatus").value = "in_stock";
                
                document.querySelectorAll('#addColorCheckboxes input[type="checkbox"]').forEach(c => c.checked = false);
                window.renderVariantInputs('add');

                selectedBase64Images = [];
            }).finally(function() {
                btn.innerText = "＋ Шинэ бараа нэмэх"; btn.disabled = false;
            });
        };

        window.openEditModal = function(prodId) {
            var prod = allProductsCache[prodId];
            if(!prod) return;

            document.getElementById("editProdId").value = prodId;
            document.getElementById("editProdName").value = prod.name || "";
            document.getElementById("editProdPrice").value = prod.price || 0;
            document.getElementById("editProdDesc").value = prod.description || "";
            document.getElementById("editProdStatus").value = prod.status || "in_stock";

            var checkboxes = document.querySelectorAll('#editColorCheckboxes input[type="checkbox"]');
            checkboxes.forEach(function(cb) {
                cb.checked = (prod.colors && prod.colors.includes(cb.value)) || (prod.variants && prod.variants[cb.value] !== undefined);
            });

            window.renderVariantInputs('edit', prod.variants || {}, prod.stock || 0);

            document.getElementById("editModal").style.display = "flex";
        };

        window.closeEditModal = function() {
            document.getElementById("editModal").style.display = "none";
        };

        window.saveProductEdit = function() {
            var prodId = document.getElementById("editProdId").value;
            var name = document.getElementById("editProdName").value.trim();
            var price = document.getElementById("editProdPrice").value.toString().trim();
            var description = document.getElementById("editProdDesc").value.trim();
            var status = document.getElementById("editProdStatus").value;
            
            var variantData = getVariantsData('edit');

            if(!name || !price) {
                alert("Нэр болон үнийг заавал бичнэ үү!");
                return;
            }

            var numericPrice = parseInt(price.replace(/[^0-9]/g, '')) || 0;

            database.ref('products/' + prodId).update({
                name: name,
                variants: variantData.variants,
                colors: variantData.colors,
                colorStocks: variantData.colorStocks,
                sizes: variantData.sizes,
                sizeStocks: variantData.sizeStocks,
                price: numericPrice,
                stock: variantData.totalStock,
                description: description,
                status: variantData.totalStock === 0 ? 'out_of_stock' : status
            }).then(() => {
                alert("Барааны мэдээлэл амжилттай шинэчлэгдлээ! ✨");
                window.closeEditModal();
            }).catch((err) => {
                alert("Алдаа гарлаа: " + err.message);
            });
        };

        window.deleteProduct = function(prodId) {
            if(confirm("Энэ барааг устгахдаа итгэлтэй байна уу?")) {
                database.ref('products/' + prodId).remove().then(() => alert("Барааг устгалаа! 🗑️"));
            }
        };

        window.completeOrder = function(orderId, productId, selectedSize, selectedColor, orderPrice) {
            if (confirm("Энэ захиалгыг хүргэгдсэн гэж хааж, орлогыг нэмэн, үлдэгдлийг хасах уу?")) {
                var cleanSize = selectedSize ? selectedSize.toString().trim() : '';
                var cleanColor = selectedColor ? selectedColor.toString().trim() : '';
                var priceToAdd = parseInt(orderPrice) || 0;

                database.ref('total_revenue').transaction(function(currentRevenue) {
                    return (currentRevenue || 0) + priceToAdd;
                });

                if (!productId || productId === 'null' || productId === 'undefined') {
                    database.ref('orders/' + orderId).remove().then(() => {
                        alert("✅ Захиалга амжилттай хаагдаж орлогод бүртгэгдлээ!");
                    });
                    return;
                }

                database.ref('products/' + productId).transaction(function(product) {
                    if (product) {
                        if (product.variants && cleanColor && cleanSize) {
                            var colorKey = Object.keys(product.variants).find(k => k.trim().toLowerCase() === cleanColor.toLowerCase());
                            if (colorKey && product.variants[colorKey]) {
                                var sizeKey = Object.keys(product.variants[colorKey]).find(k => k.trim().toLowerCase() === cleanSize.toLowerCase());
                                if (sizeKey && Number(product.variants[colorKey][sizeKey]) > 0) {
                                    product.variants[colorKey][sizeKey] = Number(product.variants[colorKey][sizeKey]) - 1;
                                    if (product.variants[colorKey][sizeKey] === 0) {
                                        delete product.variants[colorKey][sizeKey];
                                    }
                                }
                                if (Object.keys(product.variants[colorKey]).length === 0) {
                                    delete product.variants[colorKey];
                                }
                            }
                        }

                        var totalStock = 0;
                        var activeColors = new Set();
                        var activeSizes = new Set();
                        var newColorStocks = {};
                        var newSizeStocks = {};

                        if (product.variants) {
                            Object.keys(product.variants).forEach(function(c) {
                                Object.keys(product.variants[c]).forEach(function(s) {
                                    var qty = Number(product.variants[c][s]) || 0;
                                    if (qty > 0) {
                                        totalStock += qty;
                                        activeColors.add(c);
                                        activeSizes.add(s);
                                        newColorStocks[c] = (newColorStocks[c] || 0) + qty;
                                        newSizeStocks[s] = (newSizeStocks[s] || 0) + qty;
                                    }
                                });
                            });
                            product.stock = totalStock;
                            product.colors = Array.from(activeColors);
                            product.sizes = Array.from(activeSizes);
                            product.colorStocks = newColorStocks;
                            product.sizeStocks = newSizeStocks;
                        } else if (product.stock > 0) {
                            product.stock = Number(product.stock) - 1;
                        }

                        if (product.stock <= 0) {
                            product.status = 'out_of_stock';
                        }

                        product.orders = (Number(product.orders) || 0) + 1;
                    }
                    return product;
                }, function(error, committed) {
                    if (error) {
                        alert("❌ Алдаа гарлаа: " + error.message);
                    } else if (committed) {
                        database.ref('orders/' + orderId).remove().then(function() {
                            alert("✅ Захиалга амжилттай хаагдаж, орлого нэмэгдэж, үлдэгдэл хасагдлаа!");
                        });
                    }
                });
            }
        };
    </script>
